name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # 推 tag 時要能建立 Release 並上傳安裝檔

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # 型別檢查失敗不阻擋打包，但會在日誌中標示
      - run: npm run typecheck
        continue-on-error: true
      - run: npm run build
      # 推 v* 標籤：打包並上傳到 GitHub Release（含 latest.yml，應用程式靠它判斷有沒有新版）
      # 手動觸發（workflow_dispatch）只打包不發布
      - run: npx electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 未簽署的安裝檔：macOS 首次開啟需在「系統設定 → 隱私與安全性」放行
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: flowiter-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
          if-no-files-found: ignore
